<!doctype html>
<html lang="en" style="background-color: #080b12">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080B12" />
    <meta
      name="description"
      content="CampusOS — one intelligent system for everything students need, from attendance and timetables to campus services and AI-powered assistance."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />

    <title>CampusOS — Your campus. One intelligent system.</title>

    <!--
      Paint the dark canvas before React mounts.

      Without this the first frame is the light canvas and the whole product
      flashes white on load, which is exactly the impression the dark
      environment exists to avoid. Mirrors the default in src/app/theme.tsx;
      a stored preference still wins.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('campusos.theme')
          var dark =
            stored === 'dark' ||
            (stored === null && true) ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
